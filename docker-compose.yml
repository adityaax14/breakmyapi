services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: breakmyapi
      POSTGRES_PASSWORD: breakmyapi
      POSTGRES_DB: breakmyapi
    ports:
      # 5433 on the host so it does not clash with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breakmyapi"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # The deliberately-vulnerable practice target. NO published port: it is reachable only from
  # inside this Docker network (the worker), never from the host or the internet. Safety rule 2.
  notes-target:
    build: .
    command: ["uvicorn", "notes_target.app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      VULN_FLAGS: missing_auth,bola,mass_assignment   # turn bugs on to see findings; "" = the safe version. See src/notes_target.

  api:
    build: .
    env_file: .env   # the Groq key etc. are given to the container when it starts, never baked into the image
    environment:
      # Inside Docker, the other services are reached by their service NAME, on their normal port.
      DATABASE_URL: postgresql+psycopg://breakmyapi:breakmyapi@postgres:5432/breakmyapi
      REDIS_URL: redis://redis:6379/0
      # Inside Docker the practice target is at its service name, so allow that origin.
      ALLOWED_TARGETS: http://notes-target:8001
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface   # keep the downloaded embedding model between restarts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "breakmyapi.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://breakmyapi:breakmyapi@postgres:5432/breakmyapi
      REDIS_URL: redis://redis:6379/0
      ALLOWED_TARGETS: http://notes-target:8001   # the worker sends the test requests here
    volumes:
      - hf-cache:/root/.cache/huggingface   # the agent's retrieve step uses the embedding model too
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped   # if the worker crashes, Docker starts it again (and it recovers its scan)

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  hf-cache:
