[project]
name = "breakmyapi"
version = "0.1.0"
description = "An agent that tests your API for common security and reliability mistakes."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "openai>=1.40",
    "httpx>=0.27",
    "langchain-text-splitters>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "sentence-transformers>=6.1.0",
    "torch>=2.14",  # listed directly so the CPU-only source below applies to it
    "langchain-postgres>=0.0.19",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "redis>=8.1.0",
    "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/breakmyapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# On Linux (CI machines, servers), install the CPU-only build of PyTorch instead of the
# default one, which bundles several GB of graphics-card (CUDA) libraries we never use.
# Windows and Mac are unaffected.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
