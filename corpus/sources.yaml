# The documents our RAG corpus is built from. All are from OWASP (licence: CC BY-SA 4.0,
# which allows reuse with attribution, so every chunk keeps its source url for citations).
#
#   id:    short name; the downloaded file is saved as corpus/raw/<id>.md
#   title: human-readable name
#   url:   the page a person reads (used in citations)
#   raw:   the markdown file we actually download
#   tags:  which of our checks (from checks.py) the document is about; [] = none of them

sources:
