openapi: 3.0.3
info:
  title: Notes API
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

security:
  - bearerAuth: []

paths:
  /login:
    post:
      summary: Log in
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Token }

  /notes:
    get:
      summary: List my notes
      responses:
        "200": { description: Notes }

  /notes/{note_id}:
    get:
      summary: Get one note
      responses:
        "200": { description: The note }
    patch:
      summary: Update a note
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Updated }

  /admin/users:
    get:
      summary: List all users
      tags: [admin]
      responses:
        "200": { description: Users }
